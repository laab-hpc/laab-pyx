name: Build documentation

on:
  push:
  pull_request:

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r mkdocs-requirements.txt
      - run: mkdocs build --strict -f mkdocs.yaml
